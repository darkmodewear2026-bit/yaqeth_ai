<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Yaqeth AI | Enterprise Fleet Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#050811] text-white p-6">

    <div class="max-w-7xl mx-auto space-y-6">
        <div class="flex justify-between items-center bg-slate-900 p-6 rounded-2xl border border-teal-500/30">
            <h1 class="text-2xl font-bold text-teal-400">لوحة تحكم الأسطول المركزية - يقظ</h1>
            <div id="status-badge" class="text-sm bg-slate-800 px-4 py-2 rounded-full border border-teal-500/20">
                <span class="animate-pulse">●</span> نظام الرصد المشفر فعال
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700">
                <video id="webcam" class="w-full h-64 bg-black rounded-xl object-cover" autoplay muted></video>
            </div>

            <div class="lg:col-span-2 bg-slate-900 p-6 rounded-2xl border border-slate-700">
                <canvas id="speedChart" class="w-full h-64"></canvas>
            </div>
        </div>

        <div id="blackbox" class="bg-black p-4 rounded-xl border border-teal-900 font-mono text-green-500 text-xs h-32 overflow-y-auto"></div>
    </div>

    <script>
        // تفعيل الكاميرا
        navigator.mediaDevices.getUserMedia({ video: true }).then(s => document.getElementById('webcam').srcObject = s);

        // إعداد الرسم البياني
        const ctx = document.getElementById('speedChart').getContext('2d');
        const speedChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(10).fill(''),
                datasets: [{ label: 'السرعة (كم/س)', data: Array(10).fill(80), borderColor: '#00ffcc', fill: true }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        // تحديث البيانات دورياً
        setInterval(() => {
            const speed = Math.floor(Math.random() * 140);
            speedChart.data.datasets[0].data.shift();
            speedChart.data.datasets[0].data.push(speed);
            speedChart.update();

            const log = document.createElement('p');
            log.innerText = `[${new Date().toLocaleTimeString()}] Secure Packet: ${Math.random().toString(36).substring(7)} | Status: OK`;
            document.getElementById('blackbox').prepend(log);
        }, 2000);
    </script>
</body>
</html>
