<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Yaqeth AI | Enterprise Management System</title>
    <!-- ... (نفس الروابط السابقة للخطوط و Tailwind) ... -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* إضافة ستايل الـ ROI الجديد */
        .roi-card { background: linear-gradient(135deg, #00ffcc22, #050811); border: 1px solid #00ffcc44; }
    </style>
</head>
<body class="bg-[#050811] text-white">

    <!-- اللوحة التفاعلية المحسنة -->
    <div class="max-w-7xl mx-auto p-6">
        <div id="dashboard" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="roi-card p-6 rounded-2xl">
                    <h3 class="text-teal-400 font-bold">التوفير المتوقع للأسطول (ROI)</h3>
                    <p id="roi-counter" class="text-4xl font-black mt-2">0 ريال</p>
                </div>
                <div class="bg-slate-900 p-6 rounded-2xl">
                    <h3 class="text-blue-400 font-bold">حالة النظام</h3>
                    <p id="sys-status" class="text-2xl mt-2">مستقر (NCA Compliant)</p>
                </div>
                <div class="bg-slate-900 p-6 rounded-2xl">
                    <h3 class="text-purple-400 font-bold">ساعات الرصد</h3>
                    <p id="timer" class="text-2xl mt-2">00:00:00</p>
                </div>
            </div>
            <!-- (بقية المحتوى هنا كما في كودك) -->
        </div>
    </div>

    <script>
        /** 
         * المحرك المؤسسي (Enterprise Core)
         * يقوم هذا الكود بإدارة منطق العمل بالكامل 
         */
        const YaqethSystem = {
            data: { roi: 0, startTime: null },

            // تفعيل نظام حساب ROI الذكي
            startBusinessLogic: () => {
                YaqethSystem.data.startTime = Date.now();
                setInterval(() => {
                    // زيادة التوفير بناءً على زمن الرحلة (محاكاة احترافية)
                    YaqethSystem.data.roi += 2.5; 
                    document.getElementById('roi-counter').innerText = Math.floor(YaqethSystem.data.roi) + ' ريال';
                    
                    // تحديث مؤقت الرحلة
                    const diff = new Date(Date.now() - YaqethSystem.data.startTime);
                    document.getElementById('timer').innerText = diff.toISOString().substr(11, 8);
                }, 1000);
            },

            // حفظ البيانات محلياً (Cyber Security Persistence)
            saveDriverData: (name, plate) => {
                localStorage.setItem('yaqeth_driver', JSON.stringify({ name, plate }));
            }
        };

        // دمج هذه الدالة في فورم الإرسال الخاص بك
        function processFormSubmission(event) {
            event.preventDefault();
            // ... (كود التبديل بين الشاشات) ...
            YaqethSystem.startBusinessLogic();
            YaqethSystem.saveDriverData(
                document.getElementById('inDriverName').value,
                document.getElementById('inVehiclePlate').value
            );
            triggerScreenNavigation('screenOperationsDashboard Area');
        }
    </script>
</body>
</html>
