<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yaqeth AI | المنظومة الشاملة لإدارة سلامة المركبات</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200;300;400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        :root { --bg-deep: #050811; --color-primary: #00ffcc; --color-danger: #ff3366; }
        body { background-color: var(--bg-deep); color: white; font-family: 'Cairo', sans-serif; margin: 0; }
        
        /* الخلفية الترحيبية (شعار الرؤية) */
        #screenAuthenticationArea {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('https://www.vision2030.gov.sa/media/wz3n0o3s/vision-2030-logo.png') center/contain no-repeat;
            min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .screen-layout-view { display: none; }
        .view-visible { display: flex; }

        #map { width: 100%; height: 300px; border-radius: 15px; border: 2px solid var(--color-primary); margin-top: 10px; }
        .speed-overlay { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; z-index: 1000; font-size: 1.5rem; color: var(--color-primary); }
    </style>
</head>
<body>

    <div class="app-main-wrapper">
        <div class="screen-layout-view view-visible" id="screenAuthenticationArea">
            <h1 style="color:white; text-align:center;">يـقـظ | رؤية المملكة 2030</h1>
            <button class="submit-core-btn" onclick="startFullSystem()" style="width: 200px;">بدء المهمة</button>
        </div>

        <div class="screen-layout-view" id="screenOperationsDashboardArea" style="flex-direction: column; padding: 20px;">
            <div id="speed-display" class="speed-overlay">0 كم/س</div>
            <div id="map"></div>
            <div id="containerLiveFrame" class="hardware-stream-box" style="margin-top:20px;">
                <video id="webcamStreamVideo" autoplay playsinline muted></video>
            </div>
            <div id="alert-zone" style="color:var(--color-danger); font-weight:bold; margin-top:10px;"></div>
        </div>
    </div>

    <script>
        // 1. تفعيل النظام الشامل
        async function startFullSystem() {
            document.getElementById('screenAuthenticationArea').classList.remove('view-visible');
            document.getElementById('screenOperationsDashboardArea').classList.add('view-visible');
            initMap();
            initCamera();
            trackSpeed();
        }

        // 2. الخريطة والسرعة الحقيقية
        function initMap() {
            const map = L.map('map').setView([24.7136, 46.6753], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            L.marker([24.7136, 46.6753]).addTo(map).bindPopup("موقعك الحالي");
        }

        function trackSpeed() {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const speed = (pos.coords.speed * 3.6).toFixed(0);
                    document.getElementById('speed-display').innerText = (speed || 0) + " كم/س";
                });
            }
        }

        // 3. الكاميرا والذكاء الاصطناعي (رصد التشتت)
        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('webcamStreamVideo').srcObject = stream;
            
            // محاكاة الرصد (يجب دمج Face-API هنا للتطبيق الفعلي)
            setInterval(() => {
                const alertZone = document.getElementById('alert-zone');
                const isLookingAway = Math.random() > 0.8; // محاكاة تشتت
                const isLookingForward = Math.random() > 0.5;

                if (isLookingAway) {
                    alertZone.innerText = "⚠️ الرجاء عدم استخدام الجوال أو الالتفات!";
                    playHorn();
                } else if (isLookingForward) {
                    alertZone.innerText = ""; // صامت لأن السائق ينظر للطريق
                }
            }, 3000);
        }

        // 4. صوت البوق التحذيري
        function playHorn() {
            const ctx = new AudioContext();
            const osc = ctx.createOscillator();
            osc.type = 'square';
            osc.frequency.setValueAtTime(400, ctx.currentTime);
            osc.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + 0.5);
        }
    </script>
</body>
</html>
