<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Yaqeth AI | المنظومة المركزية لإدارة الأصول والسلامة</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        :root { --main: #00ffcc; --dark: #050811; --card: #0f172a; --danger: #ff3366; --panel: #1e293b; }
        body { font-family: 'Cairo', sans-serif; background: var(--dark); color: #fff; margin: 0; }
        
        /* تصميم الـ Dashboard بنظام الشبكة */
        .dashboard { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 20px; height: 100vh; }
        .sidebar { background: var(--card); padding: 20px; border-radius: 20px; }
        
        /* الصندوق الأسود السيبراني */
        .blackbox { height: 200px; background: #000; color: var(--main); font-family: monospace; overflow-y: auto; padding: 10px; border: 1px solid #333; font-size: 12px; }
        
        /* الخريطة */
        #map { height: 400px; width: 100%; border-radius: 15px; margin-bottom: 20px; }
        
        /* شاشة الدفع */
        .modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index: 9999; display: none; justify-content: center; align-items: center; }
        
        /* التحكم في حجم الكاميرا */
        .camera-container { width: 100%; height: 250px; background: #000; border-radius: 15px; overflow: hidden; border: 2px solid var(--main); }
        #webcam { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    </style>
</head>
<body>

    <div id="authPanel" style="padding: 50px;">
        <div class="auth-container" style="max-width: 500px; background:var(--card); padding:30px; border-radius:20px; margin:auto;">
            <h2>مرحباً بك في يقظ</h2>
            <input type="text" id="dName" placeholder="الاسم الثلاثي">
            <input type="text" id="vType" placeholder="المركبة وموديلها (مثال: تويوتا برادو 2026)">
            <input type="text" id="plate" placeholder="رقم اللوحة">
            <button onclick="processLogin()" style="width:100%; padding:15px; background:var(--main); border:none; border-radius:10px;">بدء الرحلة الآمنة</button>
        </div>
    </div>

    <div id="mainDashboard" class="dashboard" style="display:none;">
        <div class="sidebar">
            <h3>محفظة السائق</h3>
            <div id="walletPoints" style="font-size: 2em; color: var(--main);">0 نقطة</div>
            <hr>
            <h3>سجل الإنذارات</h3>
            <ul id="logList" style="font-size: 12px;"></ul>
        </div>

        <div class="content">
            <div id="map"></div>
            <div class="camera-container">
                <video id="webcam" autoplay playsinline muted></video>
            </div>
            <div style="margin-top:20px;">
                <button onclick="exportPDF()" class="btn">تصدير تقرير PDF للمدير</button>
            </div>
        </div>

        <div class="sidebar">
            <h3>الصندوق الأسود (NCA)</h3>
            <div class="blackbox" id="blackbox"></div>
            <h3>توفير التأمين</h3>
            <div id="savings">0 ريال</div>
        </div>
    </div>

    <div id="paymentModal" class="modal">
        <div style="background:var(--card); padding:40px; border-radius:20px; text-align:center;">
            <h2 id="payMsg">يتطلب نظام الشركات رسوم اشتراك 50 ريال</h2>
            <button onclick="confirmPayment()" style="padding:20px 40px; background:var(--main); border:none; border-radius:10px;">دفع الاشتراك وتفعيل الأسطول</button>
        </div>
    </div>

    <script>
        let sessionTime = 0;
        let points = 0;

        async function processLogin() {
            const vType = document.getElementById('vType').value.toLowerCase();
            if(vType.includes('شاحنة')) {
                document.getElementById('paymentModal').style.display = 'flex';
            } else {
                startApp();
            }
        }

        function confirmPayment() {
            document.getElementById('paymentModal').style.display = 'none';
            startApp();
        }

        async function startApp() {
            document.getElementById('authPanel').style.display = 'none';
            document.getElementById('mainDashboard').style.display = 'grid';
            
            // تشغيل الكاميرا
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            document.getElementById('webcam').srcObject = stream;

            // تهيئة الخريطة
            const map = L.map('map').setView([24.7136, 46.6753], 13);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            // عداد الـ 60 دقيقة
            setInterval(() => {
                sessionTime++;
                if(sessionTime >= 3600) { alert("انتهت الفترة التجريبية، يرجى الدفع للاستمرار."); }
            }, 1000);

            // تسجيل الصندوق الأسود
            setInterval(() => {
                const log = `[${new Date().toLocaleTimeString()}] النظام يعمل بكفاءة - حالة الأمان: ممتاز\n`;
                document.getElementById('blackbox').innerHTML += log;
            }, 5000);
        }

        function exportPDF() {
            alert("تم توليد التقرير الأمني بصيغة PDF وإرساله لغرفة العمليات.");
        }
    </script>
</body>
</html>
