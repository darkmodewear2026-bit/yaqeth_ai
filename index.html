<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Yaqeth AI | منصة إدارة سلامة الأساطيل</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #050811; color: white; font-family: 'Cairo', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(0, 255, 204, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">

    <header class="flex justify-between items-center mb-8">
        <div>
            <h1 class="text-3xl font-bold text-teal-400">يقظ | Yaqeth AI</h1>
            <p class="text-slate-400">لوحة تحكم إدارة السلامة اللوجستية المركزية</p>
        </div>
        <div class="text-right">
            <p class="text-teal-400 font-bold">الحالة: متصل</p>
            <p class="text-xs text-slate-500" id="current-time"></p>
        </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="lg:col-span-2 space-y-6">
            <div class="glass-panel p-6 rounded-2xl">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold">التتبع الحي للمركبة</h2>
                    <div id="speed-display" class="text-3xl font-mono font-bold text-white">0 km/h</div>
                </div>
                <div class="relative bg-black rounded-xl overflow-hidden aspect-video">
                    <video id="webcam" autoplay muted class="w-full h-full object-cover transform scale-x-[-1]"></video>
                    <div id="alert-overlay" class="absolute inset-0 border-4 border-transparent pointer-events-none"></div>
                </div>
            </div>
        </div>

        <div class="glass-panel p-6 rounded-2xl">
            <h2 class="text-xl font-bold mb-6">إدارة الأسطول (Dashboard)</h2>
            <div class="space-y-4">
                <div class="p-4 bg-slate-800 rounded-xl">
                    <p class="text-sm text-slate-400">إجمالي الحوادث الممنوعة اليوم</p>
                    <p class="text-2xl font-bold text-teal-400">12</p>
                </div>
                <div class="p-4 bg-slate-800 rounded-xl">
                    <p class="text-sm text-slate-400">معدل التزام السائقين</p>
                    <p class="text-2xl font-bold text-yellow-400">94%</p>
                </div>
            </div>
            <button onclick="triggerEmergencySOS()" class="w-full mt-6 bg-red-600 hover:bg-red-700 py-3 rounded-xl font-bold transition">
                <i class="fa-solid fa-triangle-exclamation"></i> إرسال نداء طوارئ (SOS)
            </button>
        </div>
    </div>

    <script>
        // محاكاة السرعة
        let currentSpeed = 80;
        setInterval(() => {
            currentSpeed = Math.floor(Math.random() * 140);
            const speedEl = document.getElementById('speed-display');
            speedEl.innerText = currentSpeed + " km/h";
            
            if(currentSpeed > 120) {
                speedEl.classList.add('text-red-500');
                document.getElementById('alert-overlay').classList.replace('border-transparent', 'border-red-600');
            } else {
                speedEl.classList.remove('text-red-500');
                document.getElementById('alert-overlay').classList.replace('border-red-600', 'border-transparent');
            }
        }, 2000);

        // تشغيل الكاميرا
        navigator.mediaDevices.getUserMedia({ video: true }).then(stream => {
            document.getElementById('webcam').srcObject = stream;
        });

        // SOS Function
        function triggerEmergencySOS() {
            alert("تم إرسال تنبيه طوارئ إلى غرفة العمليات المركزية ومزود خدمة التأمين.");
        }

        document.getElementById('current-time').innerText = new Date().toLocaleTimeString();
    </script>
</body>
</html>
