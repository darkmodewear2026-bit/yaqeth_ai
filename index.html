<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yaqeth AI | Saudi Vision 2030</title>
    <!-- مكتبة الخرائط والخطوط -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        body { margin: 0; font-family: 'Cairo', sans-serif; background: #050811; color: white; transition: 0.5s; }
        .screen { display: none; height: 100vh; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        
        /* شاشة الترحيب */
        #welcome-screen {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://www.vision2030.gov.sa/media/wz3n0o3s/vision-2030-logo.png') center/cover;
            text-align: center;
        }

        /* الإضاءة الليلية التلقائية */
        .night-mode { background: #ffffff !important; color: #000 !important; }

        /* الخريطة */
        #map { width: 95%; height: 400px; border-radius: 20px; border: 3px solid #00ffcc; margin: 20px 0; }
        
        /* عداد السرعة */
        .speed-panel { font-size: 2.5rem; font-weight: bold; color: #00ffcc; margin: 10px; }

        .btn { padding: 15px 40px; background: #00ffcc; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        
        /* إطار الكاميرا */
        #cam-box { width: 200px; height: 150px; background: black; border-radius: 10px; }
    </style>
</head>
<body>

    <!-- الشاشة الترحيبية -->
    <div id="welcome-screen" class="screen active">
        <h1 style="color:white">نظام يـقـظ - رؤية المملكة 2030</h1>
        <button class="btn" onclick="startApp()">ابدأ الرحلة الآن</button>
    </div>

    <!-- لوحة القيادة -->
    <div id="dashboard" class="screen">
        <div class="speed-panel" id="speed-display">0 كم/س</div>
        <div id="map"></div>
        <div id="cam-box"><video id="video" autoplay playsinline style="width:100%;"></video></div>
        <p id="status-text">النظام يعمل...</p>
    </div>

    <script>
        let map, marker;

        async function startApp() {
            document.getElementById('welcome-screen').classList.remove('active');
            document.getElementById('dashboard').classList.add('active');
            initMap();
            initCamera();
            // بدء مراقبة الظلام
            setInterval(checkEnvironment, 2000);
        }

        // 1. الخريطة والسرعة الحقيقية
        function initMap() {
            map = L.map('map').setView([24.7136, 46.6753], 15);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([24.7136, 46.6753]).addTo(map);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((pos) => {
                    const speed = (pos.coords.speed * 3.6).toFixed(0);
                    document.getElementById('speed-display').innerText = (speed || 0) + " كم/س";
                    marker.setLatLng([pos.coords.latitude, pos.coords.longitude]);
                    map.setView([pos.coords.latitude, pos.coords.longitude]);
                });
            }
        }

        // 2. الكاميرا والذكاء الاصطناعي (الظلام + الإنذارات)
        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true });
            document.getElementById('video').srcObject = stream;
        }

        function checkEnvironment() {
            // محاكاة كشف الظلام
            // هنا يقرأ النظام بكسلات الكاميرا، إذا كانت القيمة منخفضة (ليل):
            document.body.classList.add('night-mode'); 
            
            // محاكاة كشف السلوك (هذا الجزء يحتاج ربط مع مكتبة التعرف على الوجه)
            // إذا كان النظر للأسفل (جوال):
            triggerAlert("الرجاء عدم استخدام الجوال!");
        }

        function triggerAlert(msg) {
            // تشغيل صوت تنبيه
            const audio = new AudioContext();
            const osc = audio.createOscillator();
            osc.connect(audio.destination);
            osc.start();
            document.getElementById('status-text').innerText = msg;
            alert(msg); // تنبيه مرئي
            setTimeout(() => osc.stop(), 1000);
        }

        // منطق: تجاهل الإنذار إذا كان النظر للأمام (فوق الطبلون)
        // عند استخدام مكتبة Face-API، نضع شرط: 
        // if (lookingAtFront) { return; } else { triggerAlert(...) }
    </script>
</body>
</html>
